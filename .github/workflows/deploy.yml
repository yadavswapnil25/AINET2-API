name: Deploy to VPS

# NOTE: This workflow requires GitHub Secrets to be configured.
# If you're not using GitHub Actions for deployment, you can delete this file.
# To set up secrets: Repository Settings > Secrets and variables > Actions
# Required secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check if secrets are configured
      run: |
        if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USER }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
          echo "⚠️  GitHub Secrets are not configured. Skipping deployment."
          echo ""
          echo "To enable auto-deployment:"
          echo "1. Go to Repository Settings > Secrets and variables > Actions"
          echo "2. Add these secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY"
          echo "3. See GITHUB_ACTIONS_SETUP.md for detailed instructions"
          echo ""
          echo "If you're not using GitHub Actions, delete .github/workflows/deploy.yml"
          exit 0
        fi
        echo "✅ Secrets configured. Proceeding with deployment..."
    
    - name: Deploy to server
      if: ${{ secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.VPS_SSH_KEY != '' }}
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        script: |
          cd /var/www/AINET2-API
          git pull origin main || git pull origin master
          composer install --no-dev --optimize-autoloader --no-interaction
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache
          sudo bash fix-permissions.sh
          php artisan storage:link || true
          php artisan storage:fix-permissions --check || echo "⚠ Permission check completed"
